[workspace]
resolver = "2"
members = ["core", "sim"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/jrohde/MeshCast"

[profile.release]
debug = 1

# The smoke tests simulate hours of radio traffic; unoptimised they take minutes each.
[profile.test]
opt-level = 2
